name: Reproducibility checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validation dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run manuscript validators
        working-directory: manuscript/source
        run: |
          python scripts/validate_figure1_freeze.py
          python scripts/validate_final_qa_frozen_values.py
          python scripts/validate_main_panel_labels.py
          python scripts/validate_cgga_figure5_provenance.py
          python scripts/validate_radiomics_integration.py
          python scripts/validate_locking_simulation_integration.py
          python scripts/validate_submission_pdfs.py main.pdf supplementary_information.pdf --output "${RUNNER_TEMP}/submission_pdf_layout_qa.json"
